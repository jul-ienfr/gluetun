name: Control plane CI

on:
  push:
    branches:
      - master
      - "016-*"
    tags:
      - "v*"
    paths:
      - .github/workflows/control-plane-ci.yml
      - cmd/**
      - internal/**
      - tests/integration/**
      - .dockerignore
      - .golangci.yml
      - Dockerfile
      - go.mod
      - go.sum
  pull_request:
    paths:
      - .github/workflows/control-plane-ci.yml
      - cmd/**
      - internal/**
      - tests/integration/**
      - .dockerignore
      - .golangci.yml
      - Dockerfile
      - go.mod
      - go.sum
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test harness package
        run: go test ./tests/integration/harness -count=1

      - name: Build test image
        run: docker build --target test -t gluetun-test .

      - name: Run tests in container
        run: >-
          docker run --rm --cap-add=NET_ADMIN --device /dev/net/tun
          gluetun-test

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build harness image
        run: docker compose -f tests/integration/docker-compose.yml build

      - name: Start harness services
        run: >-
          docker compose -f tests/integration/docker-compose.yml
          up -d --wait plain dot echo-a echo-b echo-c vpn-wg-test

      - name: Verify harness
        run: docker compose -f tests/integration/docker-compose.yml run --rm check

      - name: Collect logs
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml logs

      - name: Stop harness
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v

  image:
    runs-on: ubuntu-latest
    needs: [verify, harness]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Write digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image digest"
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" > image-digest.txt

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
